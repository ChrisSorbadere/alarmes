name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dépendances Capacitor
        run: npm ci

      - name: Copier l'appli web dans le projet Android
        run: npx cap sync android

      - name: Numéro de version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          V=$(grep -o "const VERSION = '[^']*'" docs/app.js | cut -d"'" -f2)
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APP_VERSION=$V" >> $GITHUB_ENV

      - name: Compiler l'APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            grep -E "error:|e: |FAILURE|What went wrong|> |Exception" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Alarmes-${APP_VERSION}-b${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alarmes-apk
          path: Alarmes-*.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: Alarmes ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          files: Alarmes-*.apk
          make_latest: true
