<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>Alarmes</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1 id="viewTitle">Alarmes</h1>
  <span id="modeBadge" class="badge" hidden></span>
</header>

<main id="view"></main>

<button id="fab" class="fab" aria-label="Nouvelle alarme">+</button>
<button id="fabQuick" class="fab-quick" aria-label="Alarme rapide">⚡ Rapide</button>

<nav class="tabs">
  <button data-tab="list" class="active"><span class="ico">⏰</span>Alarmes</button>
  <button data-tab="calendar"><span class="ico">📅</span>Calendrier</button>
  <button data-tab="timer"><span class="ico">⏳</span>Minuteur</button>
  <button data-tab="import"><span class="ico">📥</span>Importer</button>
  <button data-tab="settings"><span class="ico">⚙️</span>Réglages</button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="ring" class="ring" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="./lib/capacitor.js"></script>
<script src="./lib/xlsx.full.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
